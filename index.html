<body>
  <main class="workspace">
    <section class="map-area" aria-label="Interaktivní mapa sítě">
      <div class="stage" id="stage">
        <div class="map-tools" role="group" aria-label="Nastavení a měřítko mapy">
          <button type="button" id="open-settings" class="icon-button settings-launch" aria-label="Nastavení aplikace" title="Nastavení aplikace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.137 5.045 L10.678 2.592 L13.322 2.592 L13.863 5.045 L15.600 5.765 L17.717 4.413 L19.587 6.283 L18.235 8.400 L18.955 10.137 L21.408 10.678 L21.408 13.322 L18.955 13.863 L18.235 15.600 L19.587 17.717 L17.717 19.587 L15.600 18.235 L13.863 18.955 L13.322 21.408 L10.678 21.408 L10.137 18.955 L8.400 18.235 L6.283 19.587 L4.413 17.717 L5.765 15.600 L5.045 13.863 L2.592 13.322 L2.592 10.678 L5.045 10.137 L5.765 8.400 L4.413 6.283 L6.283 4.413 L8.400 5.765 Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button id="zoom-in" class="icon-button" aria-label="Přiblížit mapu" title="Přiblížit mapu · gesto dvěma prsty nebo Ctrl/Cmd + kolečko">+</button>
          <button id="zoom-out" class="icon-button" aria-label="Oddálit mapu" title="Oddálit mapu · gesto dvěma prsty nebo Ctrl/Cmd + kolečko">−</button>
        </div>
        <svg id="network-map" role="group" aria-label="Síťová mapa. Zařízení a spoje lze otevřít klepnutím. Přiblížení gestem dvěma prsty nebo Ctrl a kolečkem myši." viewBox="35 270 465 440"></svg>
        <div class="map-display-controls">
          <label class="labels-control" id="signal-coverage-control" hidden title="Ilustrační dosah Wi-Fi, BTS a satelitu bez skutečného měřítka. Připojení ani rychlost přenosu se nemění."><input id="signal-coverage" type="checkbox"> Dosah signálu</label>
        </div>
        <div class="monitor-overlay" id="monitor-overlay" hidden>
          <section class="monitor-window" id="monitor-content" role="dialog" aria-modal="false" aria-labelledby="computer-title" tabindex="-1"></section>
        </div>
        <div class="device-overlay" id="device-overlay" hidden>
          <section class="device-window" id="device-content" role="dialog" aria-modal="false" aria-labelledby="device-title" tabindex="-1">
            <div class="device-window-bar">
              <h2 class="device-window-title" id="device-title"></h2>
              <button class="device-close" data-action="close-device" aria-label="Zavřít informace o zařízení a vrátit se k mapě"><span aria-hidden="true">×</span></button>
            </div>
            <div class="device-controls" id="device-controls" hidden></div>
            <div class="device-body" id="device-body"></div>
            <div class="device-help" id="device-help" hidden>
              <button type="button" id="device-help-trigger" class="device-help-trigger" aria-label="Nápověda k zařízení" aria-expanded="false" aria-controls="device-help-content">?</button>
              <div class="device-help-content" id="device-help-content" role="region" aria-label="Nápověda k zařízení" tabindex="0" hidden></div>
            </div>
          </section>
        </div>
      </div>
      <footer class="transport explanation-hidden" aria-label="Ovládání přenosu">
        <div class="transport-status" id="transmission-explanation" hidden><span class="status-dot" id="run-dot"></span><div><strong id="event-title">Síť čeká na tvůj první přenos</strong><span id="event-description">Klikni na notebook v mapě a otevři jeho plochu.</span></div></div>
        <div class="transport-actions">
          <button type="button" id="toggle-explanation" class="secondary-button explanation-toggle" aria-expanded="false" aria-controls="transmission-explanation" aria-label="Zobrazit vysvětlení"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg><span>Vysvětlení</span></button>
          <div class="transport-buttons"><button id="repeat" class="icon-button" aria-label="Opakovat stejnou akci" disabled>↻</button><button id="play" class="primary-button play" disabled aria-label="Přehrát přenos">▶ <span>Přehrát</span></button><button id="step" class="secondary-button" disabled>Krok <span aria-hidden="true">→</span></button></div>
        </div>
      </footer>
    </section>
  </main>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form>
      <header class="settings-header"><div><h2 id="settings-title">Nastavení aplikace</h2></div><button type="button" class="device-close" data-settings-action="close" aria-label="Zavřít nastavení bez použití změn" autofocus>×</button></header>
      <div class="settings-scroll"><div class="settings-toolbar"><span id="settings-count"></span><button type="button" class="inline-link" data-settings-action="base">Základní sestava</button><button type="button" class="inline-link" data-settings-action="all">Zapnout vše</button></div><div id="settings-options"></div></div>
      <footer class="settings-footer"><button type="submit" class="primary-button">Použít změny</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <noscript>Pro interaktivní model povol JavaScript. Aplikace neposílá žádná data mimo prohlížeč.</noscript>
</body>
</html>
